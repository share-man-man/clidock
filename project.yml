name: Popback
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  defaultConfig: Release
configs:
  Debug: debug
  Local: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "3.1.0"
targets:
  Popback:
    type: application
    platform: macOS
    sources:
      - Popback
      - path: LICENSE
        buildPhase: resources
      - path: Licenses/KeyboardShortcuts.txt
        buildPhase: resources
    settings:
      base:
        POPBACK_BASE_IDENTIFIER: io.github.share-man-man.popback
        PRODUCT_BUNDLE_IDENTIFIER: $(POPBACK_BASE_IDENTIFIER)
        PRODUCT_MODULE_NAME: Popback
        POPBACK_URL_SCHEME: popback
        POPBACK_MENU_BADGE: ""
        POPBACK_MENU_BANNER: ""
        INFOPLIST_FILE: Popback/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          PRODUCT_NAME: PopbackDev
          PRODUCT_BUNDLE_IDENTIFIER: $(POPBACK_BASE_IDENTIFIER).dev
          POPBACK_URL_SCHEME: popback-dev
          POPBACK_MENU_BADGE: DEV
          POPBACK_MENU_BANNER: "$(PRODUCT_NAME) · $(POPBACK_MENU_BADGE)"
        Local:
          PRODUCT_NAME: PopbackLocal
          PRODUCT_BUNDLE_IDENTIFIER: $(POPBACK_BASE_IDENTIFIER).local
          POPBACK_URL_SCHEME: popback-local
          POPBACK_MENU_BANNER: "$(PRODUCT_NAME) · LOCAL"
        Release:
          CODE_SIGN_IDENTITY: "-"
    dependencies:
      - package: KeyboardShortcuts
    configFiles:
      Debug: Config/Signing.xcconfig
      Local: Config/Signing.xcconfig
  PopbackTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Popback/Utilities/CardColors.swift
      - path: Popback/Utilities/DesignTokens.swift
      - path: Popback/Utilities/PanelTabShortcut.swift
      - path: Popback/Utilities/WheelScrollTranslation.swift
      - path: Popback/Panel/PanelContentContainer.swift
      - path: Popback/Utilities/PasteKeyCode.swift
      - path: Popback/Utilities/DirectPastePermissionGuide.swift
      - path: Popback/Utilities/LocalStateReset.swift
      - path: Popback/Utilities/ClipQueueList.swift
      - path: Popback/Services/ContentTypeClassifier.swift
      - path: Popback/Models/FileClip.swift
      - path: Popback/Utilities/FileImageThumbnail.swift
      - path: Popback/Services/PasteService.swift
      - path: Popback/SearchState.swift
      - path: Popback/Services/ClipQueuePasteboard.swift
      - path: Popback/Utilities/OwnPasteboardWrite.swift
      - path: Popback/Utilities/ClipQueueWindowGeometry.swift
      - path: Popback/Utilities/RepeatedPressFilter.swift
      - path: Popback/Utilities/HistoryRetention.swift
      - path: Popback/Utilities/ListDragAutoScroll.swift
      - path: Popback/Utilities/PointerDrag.swift
      - path: Popback/Utilities/URLCommand.swift
      - path: Popback/Utilities/Bundle+BuildInfo.swift
      - path: Popback/Services/ClipUndoStack.swift
      - path: Popback/Models/ClipboardItem.swift
      - path: Popback/Models/Pinboard.swift
      - path: Popback/Models/PinboardEntry.swift
      - path: Popback/Models/ContentType.swift
      - path: Popback/AppIdentity.swift
      - path: Popback/Utilities/AppUpdateLogic.swift
      - path: Popback/Models/ExcludedApp.swift
      - path: Popback/Utilities/Logger+Popback.swift
      - path: Popback/Services/StoreManager.swift
      - path: Popback/Services/TransferService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.share-man-man.popback.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Popback:
    build:
      targets:
        Popback: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PopbackTests
    archive:
      config: Release
